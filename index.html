    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body {
        margin: 0;
        background-color: #050505;
        font-family: 'Press Start 2P', cursive;
        color: #fff;
        overflow: hidden;
        touch-action: none; /* Prevent browser gestures */
      }
      canvas {
        image-rendering: pixelated;
      }
      .crt-overlay {
        pointer-events: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle, rgba(18, 16, 16, 0) 40%, rgba(0, 0, 0, 0.4) 100%);
        z-index: 50;
      }
      .scanlines {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 51;
        background: linear-gradient(to bottom, transparent 50%, rgba(255, 255, 255, 0.02) 51%);
        background-size: 100% 3px;
        pointer-events: none;
        opacity: 0.5;
      }
    </style>
